{% extends "base.html" %}
{% block title %}登录 - Subscription Relay{% endblock %}
{% block body %}
<div class="login-wrapper">
  <div class="card login-card shadow">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <div class="login-logo">📡</div>
        <h5 class="mb-1" style="font-weight: 700; letter-spacing: -0.02em">Subscription Relay</h5>
        <div class="small" style="color: var(--sr-secondary)">轻量级订阅中转与管理服务</div>
      </div>
      {% if error %}
      <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="post" action="/admin/login">
        <div class="mb-3">
          <label class="form-label">用户名</label>
          <input type="text" class="form-control" name="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">密码</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">登 录</button>
      </form>
    </div>
  </div>
  <div class="login-foot">v{{ version }}</div>
</div>
{% endblock %}
